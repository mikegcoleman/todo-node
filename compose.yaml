services:
  app:
    build:
      context: .
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
    environment:
      - DB_CONNECT=http://db:5432
    depends_on:
      - db
    volumes:
      - pgdata:/var/lib/postgresql/data

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todos
    ports:
      - "5432:5432"

volumes:
  pgdata:
