name: Test, Scan, and Deploy

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: mikegcoleman/image

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TC_CLOUD_TOKEN: ${{ secrets.TC_CLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Enable Testcontainers Cloud
        run: |
          npm install -g @testcontainers/cli
          testcontainers-cloud auth --token $TC_CLOUD_TOKEN
          testcontainers-cloud up

      - name: Run tests
        run: npm test

  build-and-scan:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:${{ steps.vars.outputs.sha_short }} .

      - name: Docker Scout Scan
        id: scout-scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: $IMAGE_NAME:latest
          only-severities: critical,high
          exit-code: true

      - name: Push Docker images (if scan passed)
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ steps.vars.outputs.sha_short }}
